<section class="hero-wrap hero-wrap-2 js-fullheight" style="background-image: url('images/pack_bg.jpg');">
  <div class="overlay"></div>
  <div class="container">
    <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
      <div class="col-md-9 ftco-animate pb-5 text-center">
         <p class="breadcrumbs">
           <span class="mr-2">
             <a routerLink="/">Accueil <i class="fa fa-chevron-right"></i></a>
           </span> 
           <span>Liste des Forfaits <i class="fa fa-chevron-right"></i></span>
         </p>
         <h1 class="mb-0 bread">Liste des Forfaits</h1>
     </div>
    </div>
  </div>
</section>

<section class="ftco-section">
  <div class="container">
    <div class="container">
    <div class="row">
      <!-- Loop through packs -->
      <div *ngFor="let pack of packs" class="col-md-4 ftco-animate d-flex">
  <div class="project-wrap d-flex flex-column">
    <!-- Image -->
    <a [routerLink]="['/packs', pack.id]" 
       class="img d-block mb-2"
       [ngStyle]="{
         'background-image': 'url(' + (pack.images[0] || 'default.jpg') + ')',
         'height': '220px',
         'background-size': 'cover',
         'background-position': 'center'
       }">
      <span class="price">{{ pack.price }} TND / personne</span>
    </a>

    <!-- Text content -->
    <div class="text p-4 flex-grow-1 d-flex flex-column">
      <span class="days">{{ pack.days }} jours de circuit</span>
      <h3><a [routerLink]="['/packs', pack.id]">{{ pack.name }}</a></h3>
      <p class="description text-muted">{{ pack.description }}</p>
      <p class="text-muted"><span class="fa fa-map-marker"></span> {{pack.country}} - {{pack.location}}</p>
      <!-- Activities: first 3 only -->
      <ul *ngIf="pack.activities.length" class="mt-auto">
        <li *ngFor="let act of pack.activities | slice:0:3">{{ act.activity }}</li>
      </ul>
    </div>
  </div>
</div>
    </div>

  </div>
  </div>
</section>
