<section class="hero-wrap hero-wrap-2 js-fullheight" style="background-image: url('images/plane_bg.jpg');">
  <div class="overlay"></div>
  <div class="container">
    <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
      <div class="col-md-9 ftco-animate pb-5 text-center">
        <p class="breadcrumbs"><span class="mr-2"><a routerLink="/">Accueil <i
                class="fa fa-chevron-right"></i></a></span> <span>Liste des Tours <i
              class="fa fa-chevron-right"></i></span></p>
        <h1 class="mb-0 bread">Liste des Tours</h1>
      </div>
    </div>
  </div>
</section>

<section class="ftco-section ftco-no-pb">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="search-wrap-1 ftco-animate">

          <form class="search-property-1" (ngSubmit)="onSearch()">
            <div class="row no-gutters">

              <!-- Destination -->
              <div class="col-lg d-flex">
                <div class="form-group p-4 border-0" style="position: relative;" (click)="$event.stopPropagation()">
  <label>Destination</label>

  <div class="form-field" style="position: relative;">
    <div class="icon"><span class="fa fa-search"></span></div>

    <input
      type="text"
      class="form-control"
      placeholder="Rechercher un lieu"
      [(ngModel)]="searchQuery"
      name="searchQuery"
      (input)="onDestinationInput()"
      (keydown)="onKeyDown($event)"
      (focus)="showSuggestions = suggestions.length > 0"
      autocomplete="off"
    />

    <ul *ngIf="showSuggestions && suggestions.length" class="suggestions-list">
      <li
        *ngFor="let s of suggestions; let i = index"
        (mousedown)="selectSuggestion(s)"
        [class.active]="i === activeSuggestionIndex"
        class="suggestion-item"
      >
        {{ s.name }} - {{ s.country }}
      </li>
    </ul>
  </div>
</div>

              </div>


              <!-- Date d'arrivée -->
<div class="col-lg d-flex">
  <div class="form-group p-4">
    <label>Date d'arrivée</label>
    <div class="form-field no-left-icon">
      <input
        type="date"
        class="form-control"
        [(ngModel)]="checkIn"
        name="checkIn"
        [min]="today"
      />
    </div>
  </div>
</div>

<!-- Date de départ -->
<div class="col-lg d-flex">
  <div class="form-group p-4">
    <label>Date de départ</label>
    <div class="form-field no-left-icon">
      <input
        type="date"
        class="form-control"
        [(ngModel)]="checkOut"
        name="checkOut"
        [min]="checkIn || today"
      />
    </div>
  </div>
</div>



              <!-- Prix max -->
              <div class="col-lg d-flex">
                <div class="form-group p-4">
                  <label>Limite de prix</label>
                  <div class="form-field">
                    <div class="select-wrap">
                      <div class="icon"><span class="fa fa-chevron-down"></span></div>
                      <select class="form-control" [(ngModel)]="maxPrice" name="maxPrice">
                        <option [ngValue]="null">Aucune limite</option>
                        <option [ngValue]="500">500 TND</option>
                        <option [ngValue]="1000">1000 TND</option>
                        <option [ngValue]="2000">2000 TND</option>
                        <option [ngValue]="3000">3000 TND</option>
                        <option [ngValue]="4000">4000 TND</option>
                        <option [ngValue]="5000">5000 TND</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Buttons -->
              <div class="col-lg d-flex">
                <div class="form-group d-flex w-100 border-0 p-4">
                  <div class="form-field w-100 d-flex align-items-center">

                    <button type="submit" class="btn btn-primary w-100 mr-2">
                      Rechercher
                    </button>

                  </div>
                </div>
              </div>

            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>


<section class="ftco-section">
  <div class="container">
    <div class="row">
      <div *ngFor="let destination of destinations" class="col-md-4 ftco-animate">
        <div class="project-wrap destination">

          <!-- Image -->
          <a [routerLink]="['/destination', destination.id]" class="img d-block mb-2"
            [style.background-image]="'url(' + destination.images[0] + ')'">
            <span class="price">{{ destination.price }} TND /personne</span>
          </a>

          <!-- Text content -->
          <div class="text p-4">
            <span class="days">{{ destination.days }} Jours de Tour</span>
            <h3><a [routerLink]="['/destination', destination.id]">{{ destination.name }}</a></h3>
            <p class="description text-muted">{{ destination.title }}</p>
            <p class="location"><span class="fa fa-map-marker"></span> {{ destination.name }} - {{ destination.country
              }}</p>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
