<div class="login-container">
  <h2>Connexion</h2>
  <form (ngSubmit)="login()">
    <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required>
    <input type="password" placeholder="Mot de passe" [(ngModel)]="password" name="password" required>
    <button type="submit">Se connecter</button>
    <p style="margin-top:10px;">
  <a routerLink="/forgot-password">Mot de passe oublié ?</a>
</p>

  </form>

  <p *ngIf="message">{{ message }}</p>

  <p>
    Vous n'avez pas de compte ?
    <a routerLink="/signup">Créer un compte</a>
  </p>
</div>
